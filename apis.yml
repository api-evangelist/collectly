aid: collectly

name: Collectly

description: Collectly is a healthtech company providing AI-powered revenue cycle automation for healthcare providers, spanning the full patient
  financial journey from insurance eligibility and cost estimation through point-of-service and post-visit payment collection. Its platform includes
  pre-visit intake automation, AI eligibility and benefits checks, AI cost estimation, point-of-service payments, post-visit billing automation,
  a payments platform, and an AI voice agent (Billie) for patient billing support. Collectly exposes a Partners API (JWT-authenticated, practice-scoped
  REST) covering practices, patients, appointments, providers, locations, insurance companies and policies, statements, payments, refunds, and
  subscriptions, plus embeddable patient portal / iframe components and outbound webhooks. Backed by Sapphire Ventures.

