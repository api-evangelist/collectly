openapi: 3.2.0
info:
  description: '### Pagination

    Requests that return multiple items will be paginated to 100 items by default.

    You can specify further pages with the ?page parameter. For some resources, you can also set a custom

    page size up to 1000 with the ?per_page parameter.


    X-Total-Count – Total number of results

    X-Limit – Number results per page

    X-Page-Last – Number of last page

    X-Page – Current Page Number (starts from 0)'
  title: partners1 Statements API
  version: '1'
servers:
- url: sandbox.collectly.co/api/api/partners/v1
security:
- ApiKey: []
tags:
- name: Statements
paths:
  /practices/{practice_id}/patients/{patient_id}/statement:
    get:
      description: 'This endpoint is an alternative data model where you do not need to push

        payments and allocations separately. You just POST a complete

        list of outstanding visits/charges and this statement will be presented

        to the patient as POSTed.

        /visit endpoint is ignored if you POSTed the statement for the patient

        /payments that have the post_date before the statement are also ignored'
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Patient ID from your integration who owns the resource
        in: path
        name: patient_id
        required: true
        schema:
          type: string
      - description: Page number of dataset
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
      - description: Custom page size of dataset
        in: query
        name: per_page
        required: false
        schema:
          default: 100
          type: integer
      - description: String with a comma-separated list of parameters by which to sort the dataset. To specify a descending order, add a "-" character before the parameter. For example, `?sort=-created_at,id`
        in: query
        name: sort
        required: false
        schema:
          example: ''
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPartner'
          description: OK
          headers:
            X-Limit:
              description: Number results per page. Requests that return multiple items will be paginated to 100 items by default. You can specify further pages with the `?page` parameter. For some resources, you can also set a custom page size up to 1000 with the `?per_page` parameter.
              schema:
                type: integer
            X-Page:
              description: Current Page Number (starts from 0)
              schema:
                type: integer
            X-Page-Last:
              description: Number of last page
              schema:
                type: integer
            X-Total-Count:
              description: Total number of results
              schema:
                type: integer
      summary: Get current patient statement
      tags:
      - Statements
      operationId: getPracticesByPracticeIdPatientsByPatientIdStatement
      x-operation-id-source: derived
    post:
      description: 'POSTing a statement will create a new billing cycle for a patient in case there were no active billing cycle yet (patient balance was <= zero). Please pass only IDs for connected entities, not the full objects: patient_id, location_id, provider_id'
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Patient ID from your integration who owns the resource
        in: path
        name: patient_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotPartner'
        description: Request Body
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPartner'
          description: OK
          headers: {}
      summary: Update current patient statement
      tags:
      - Statements
      operationId: postPracticesByPracticeIdPatientsByPatientIdStatement
      x-operation-id-source: derived
  /practices/{practice_id}/patients/{patient_id}/statement/{statements}:
    get:
      description: 'This endpoint is an alternative data model where you do not need to push

        payments and allocations separately. You just POST a complete

        list of outstanding visits/charges and this statement will be presented

        to the patient as POSTed.

        /visit endpoint is ignored if you POSTed the statement for the patient

        /payments that have the post_date before the statement are also ignored'
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Patient ID from your integration who owns the resource
        in: path
        name: patient_id
        required: true
        schema:
          type: string
      - description: Resource Identifier
        in: path
        name: statements
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPartner'
          description: OK
          headers: {}
      summary: Get current patient statement
      tags:
      - Statements
      operationId: getPracticesByPracticeIdPatientsByPatientIdStatementByStatements
      x-operation-id-source: derived
