      operationId: getPracticesByPracticeIdPatientsByPatientIdPaymentPlansByPaymentPlans
      x-operation-id-source: derived
    patch:
      description: 'Update the payment plan or reschedule a regular payment date.


        Properties you can update for any payment plan type:

        - ''start_date'' - all next installments will be charged starting from this date.

        The date is required when you change a period type or you update a plan with missed payments.

        The start date must not be in the past. The interval between the last scheduled

        payment to the new start date must be no more than two plan periods (month, 2 weeks, week).

        - ''installment''

        - ''period_type''

        - ''collectly_payment_method_id''

        - ''external_payment_method_id'' - can be used only for patients that have `metadata.stripe_customer_id` set

        If you update an upfront payment plan you can additionally set new ''total_amount''.

        All changes will take effect immediately.'
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Patient ID from your integration who owns the resource
        in: path
        name: patient_id
        required: true
        schema:
          type: string
      - description: Resource Identifier
        in: path
        name: payment_plans
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlan'
        description: Request Body
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlan'
          description: OK
          headers: {}
      summary: Update the payment plan or reschedule a regular payment date
      tags:
      - Payment Plans
      operationId: patchPracticesByPracticeIdPatientsByPatientIdPaymentPlansByPaymentPlans
      x-operation-id-source: derived
components:
  schemas:
    PaymentPlan:
      properties:
        collectly_id:
          description: Unique Collectly resource ID
          readOnly: true
          type: string
        collectly_payment_method_id:
          description: Collectly payment method ID which you can obtain from "/payment-methods" endpoint
          type:
          - string
          - 'null'
        created_at:
          readOnly: true
        installment:
          description: Amount to charge every week/2nd week/month according to period_type.
          minimum: 0.01
          type: number
        location_id:
          description: This field determines where to route funds for pre-service payment plans in case multiple bank accounts are connected. Should be empty in other cases.
          type:
          - string
          - 'null'
        n_installments:
          description: The total count of planned payments for this payment plan.
          format: int32
          readOnly: true
          type: integer
        next_payment_date:
          description: datetime of the next planned charge
          format: date
          readOnly: true
          type: string
        payments_made:
          description: The count of already charged payments for this payment plan.
          format: int32
          readOnly: true
          type: integer
        period_type:
          default: monthly
          description: Determines the frequency of installments.
          enum:
          - monthly
          - weekly
          - biweekly
          - semimonthly
          type: string
        start_date:
          description: 'ISO-8601 date format. The date when the first installment will be charged. Must not be in the past. Successive installment dates are computed according to the "period_type". Convert the start date to UTC timezone. '
          format: date
          type: string
        status:
          description: Current status of the payment plan
          enum:
          - not_subscribed
          - subscribed
          - paid
          - cancelled
          - declined
          - failed
          readOnly: true
          type:
          - string
          - 'null'
        total_amount:
          description: Total amount to be charged on the payment plan.It is always equal to patient balance at payment plan subscription momentfor the "standard" type.
          minimum: 0.01
          type:
          - number
          - 'null'
        type:
          default: standard
          description: '"standard" - post-service payment plan, "upfront" - pre-service payment plan'
          enum:
          - standard
          - upfront
          type: string
      required:
      - installment
      type: object
  securitySchemes:
    ApiKey:
      in: header
      name: Authorization
      type: apiKey
