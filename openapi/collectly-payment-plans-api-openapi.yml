      - description: Patient ID from your integration who owns the resource
        in: path
        name: patient_id
        required: true
        schema:
          type: string
      - description: Page number of dataset
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
      - description: Custom page size of dataset
        in: query
        name: per_page
        required: false
        schema:
          default: 100
          type: integer
      - description: String with a comma-separated list of parameters by which to sort the dataset. To specify a descending order, add a "-" character before the parameter. For example, `?sort=-created_at,id`
        in: query
        name: sort
        required: false
        schema:
          example: ''
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlan'
          description: OK
          headers:
            X-Limit:
              description: Number results per page. Requests that return multiple items will be paginated to 100 items by default. You can specify further pages with the `?page` parameter. For some resources, you can also set a custom page size up to 1000 with the `?per_page` parameter.
              schema:
                type: integer
            X-Page:
              description: Current Page Number (starts from 0)
              schema:
                type: integer
            X-Page-Last:
              description: Number of last page
              schema:
                type: integer
            X-Total-Count:
              description: Total number of results
              schema:
                type: integer
      summary: Retrieve a patient's payment plan or list of all payment plans
      tags:
      - Payment Plans
      operationId: getPracticesByPracticeIdPatientsByPatientIdPaymentPlans
      x-operation-id-source: derived
    post:
      description: 'Create a new payment plan for a patient.


        There are two types of payment plans:

        1. `type: "standard"`. The standard post-service payment plan may be created only in case there is an outstanding

        patient balance. Standard payment plan checks the current patient balance on every installment and charges

        `installment` amount, but not more than the current balance of the patient.

        Payment plan also stops when the total installments sum reaches the "total_amount". The last installment in

        this case may be less than the `installment`. E.g. plan for `total_amount` of $100 and installment of $40

        the last installment amount is $20.


        2. type: "upfront". This is a pre-service payment plan. It does not check the current patient balance, may be

        started with any patient balance and will be charged up to a "total_amount".


        One of the `collectly_payment_method_id`, `external_payment_method_id` is required since

        payment plan requires a payment method. `external_payment_method_id` can be used only for patients that

        have `metadata.stripe_customer_id` set.'
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Patient ID from your integration who owns the resource
        in: path
        name: patient_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlan'
        description: Request Body
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlan'
          description: OK
          headers: {}
      summary: Create a new payment plan for a patient
      tags:
      - Payment Plans
      operationId: postPracticesByPracticeIdPatientsByPatientIdPaymentPlans
      x-operation-id-source: derived
