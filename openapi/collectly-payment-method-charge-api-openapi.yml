              $ref: '#/components/schemas/PaymentMethodCharge'
        description: Request Body
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodCharge'
          description: OK
          headers: {}
      summary: Charge patient card
      tags:
      - payment_method_charge
      operationId: postPracticesByPracticeIdPatientsByPatientIdPaymentMethodsByPaymentMethodsCharge
