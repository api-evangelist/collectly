components:
  schemas:
    PaymentMethodCharge:
      properties:
        amount:
          description: Specifies the total amount to be charged from patient.
          type: number
        copay_amount:
          description: Specifies how much of the amount is considered a pre-payment for future services and will be posted to EHR as unapplied.
          type: number
        type:
          description: Payment type. Copay does not check against the current balance. Type "payment" can only be charged when patient has an open balance.
          enum:
          - payment
          - copay
          type: string
      type: object
