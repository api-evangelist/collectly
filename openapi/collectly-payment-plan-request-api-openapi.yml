paths:
  /practices/{practice_id}/patients/{patient_id}/payment-plans/request:
    post:
      description: 'Send link to the patient to subscribe for payment plan (request payment plan consent).

        Payment plan is created in "not_subscribed" status and starts only when a patient enters the credit card and

        signs the consent on the patient portal. You must specify the patient''s email

        or phone number to send a consent request. For immediate payment plan creation with existing payment methods

        use the POST /patients/{patient_id}/payment_plans endpoint'
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Patient ID from your integration who owns the resource
        in: path
        name: patient_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanRequest'
        description: Request Body
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanRequest'
          description: OK
          headers: {}
      summary: Send link to the patient to subscribe for payment plan (request payment plan…
      tags:
      - payment_plan_request
      operationId: postPracticesByPracticeIdPatientsByPatientIdPaymentPlansRequest
      x-operation-id-source: derived
components:
  schemas:
    PaymentPlanRequest:
      properties:
        email:
          description: Patient email to send a consent request
          format: email
          type: string
        installment:
          description: Amount to charge every week/2nd week/month according to period_type.
          minimum: 0.01
          type: number
        location_id:
          description: This field determines where to route funds for pre-service payment plans in case multiple bank accounts are connected. Should be empty in other cases.
          type:
          - string
          - 'null'
        n_installments:
          format: int32
          type: integer
        period_type:
          default: monthly
          description: Determines the frequency of installments.
          enum:
          - monthly
          - weekly
          - biweekly
          - semimonthly
          type: string
        phone:
          description: Patient phone to send a consent request
          type: string
        start_date:
          description: "ISO8601-formatted date string.\n\n    :param kwargs: The same keyword arguments that :class:`Field` receives.\n    "
          type: string
        total_amount:
          description: Total amount to be charged on the payment plan.It is always equal to patient balance at payment plan subscription momentfor the "standard" type.
          minimum: 0.01
          type:
          - number
          - 'null'
        type:
          default: standard
          description: '"standard" - post-service payment plan, "upfront" - pre-service payment plan'
          enum:
          - standard
          - upfront
          type: string
      required:
      - installment
      type: object
  securitySchemes:
    ApiKey:
      in: header
      name: Authorization
      type: apiKey
