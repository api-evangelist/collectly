openapi: 3.2.0
info:
  description: '### Pagination

    Requests that return multiple items will be paginated to 100 items by default.

    You can specify further pages with the ?page parameter. For some resources, you can also set a custom

    page size up to 1000 with the ?per_page parameter.


    X-Total-Count – Total number of results

    X-Limit – Number results per page

    X-Page-Last – Number of last page

    X-Page – Current Page Number (starts from 0)'
  title: partners1 Payments API
  version: '1'
servers:
- url: sandbox.collectly.co/api/api/partners/v1
security:
- ApiKey: []
tags:
- name: Payments
paths:
  /practices/{practice_id}/payments:
    get:
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Page number of dataset
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
      - description: Custom page size of dataset
        in: query
        name: per_page
        required: false
        schema:
          default: 100
          type: integer
      - description: String with a comma-separated list of parameters by which to sort the dataset. To specify a descending order, add a "-" character before the parameter. For example, `?sort=-created_at,id`
        in: query
        name: sort
        required: false
        schema:
          example: ''
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: OK
          headers:
            X-Limit:
              description: Number results per page. Requests that return multiple items will be paginated to 100 items by default. You can specify further pages with the `?page` parameter. For some resources, you can also set a custom page size up to 1000 with the `?per_page` parameter.
              schema:
                type: integer
            X-Page:
              description: Current Page Number (starts from 0)
              schema:
                type: integer
            X-Page-Last:
              description: Number of last page
              schema:
                type: integer
            X-Total-Count:
              description: Total number of results
              schema:
                type: integer
      summary: Get payments information.
      tags:
      - Payments
      operationId: getPracticesByPracticeIdPayments
      x-operation-id-source: derived
  /practices/{practice_id}/payments/{payment_id}/refund:
    post:
      description: 'Refund payment.

        Payment can be refunded both fully and partially.'
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Payment ID (Collectly ID)
        in: path
        name: payment_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
        description: Request Body
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: OK
          headers: {}
      summary: Refund payment
      tags:
      - Payments
      operationId: postPracticesByPracticeIdPaymentsByPaymentIdRefund
      x-operation-id-source: derived
  /practices/{practice_id}/payments/{payments}:
    get:
      parameters:
      - description: Practice ID in which the requested resource exists
        in: path
        name: practice_id
        required: true
        schema:
          type: string
      - description: Resource Identifier
        in: path
        name: payments
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: OK
          headers: {}
      summary: Get payments information.
      tags:
      - Payments
      operationId: getPracticesByPracticeIdPaymentsByPayments
      x-operation-id-source: derived
components:
  schemas:
    Allocation:
      properties:
        amount:
          type: number
        charge_id:
          type:
          - string
          - 'null'
        id:
          readOnly: true
          type: string
        visit_id: {}
      required:
      - amount
      type: object
    Payment:
      properties:
        allocations:
          items:
            $ref: '#/components/schemas/Allocation'
          type: array
        amount:
          type:
          - number
          - 'null'
        collectly_id:
          description: Unique Collectly resource ID
          readOnly: true
          type: string
        collectly_payment_plan_id:
          description: Collectly payment plan ID. It is NOT null in case the payment was charged as a part of the payment plan
          type: string
        collectly_source_payment_id:
          description: Collectly source payment ID. Used only for refunds.
          type: string
        copay_amount:
          type: number
        created_at:
          readOnly: true
        id:
          description: Unique resource ID from your integration
          type: string
        modified_at:
          readOnly: true
        patient_id:
          description: Patient ID from your integration who owns the resource
          type: string
        payment_type:
          enum:
          - payment
          - copay
          - refund
          - part_ref
          - autodeb
          - collect
          type: string
        post_date:
          format: date
          type:
          - string
          - 'null'
        status:
          readOnly: true
          type: string
        transaction_id:
          type:
          - string
          - 'null'
      required:
      - id
      - patient_id
      type: object
  securitySchemes:
    ApiKey:
      in: header
      name: Authorization
      type: apiKey
