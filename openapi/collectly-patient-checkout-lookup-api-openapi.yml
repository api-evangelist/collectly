          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLookup'
          description: OK
          headers: {}
      summary: Lookup patient by external_id
      tags:
      - patient_checkout__lookup
      operationId: postPatientLookup
      x-operation-id-source: derived
components:
  schemas:
    PatientLookup:
      properties:
        client_id:
          format: int32
          type: integer
          writeOnly: true
        collectly_patient_id:
          format: int32
          readOnly: true
          type: integer
        patient_external_id:
